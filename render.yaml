services:
  - type: web
    # Service name deliberately NOT renamed to delvio-rule-studio: changing it would make
    # Render's blueprint sync create a brand-new service (new DB conn, new URL, cold start).
    # Repo/folder renamed 2026-08-05; the URL fix is the rules.delviotax.com custom domain.
    name: sherpa-tax-rule-studio
    runtime: python
    region: virginia
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn server.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: NODE_VERSION
        value: "22"

  # Change-register scheduler — runs every automated FEED_POLL detector arm DAILY and opens
  # DETECTED items (drafts post ~6/day in season; weekly was too slow — Phase 2 split, 2026-08-05).
  # Only fills the register; the gates are untouched.
  # DATABASE_URL must match the web service's (same Supabase project). Optional: set
  # PUSHOVER_TOKEN + PUSHOVER_USER to get a ping when new items are opened.
  - type: cron
    name: sherpa-rs-change-feeds
    runtime: python
    region: virginia
    plan: starter
    schedule: "0 11 * * *"  # daily 11:00 UTC (7am ET); arms overlap their lookbacks, dedup absorbs it
    buildCommand: pip install -r requirements.txt  # no frontend build needed for the cron
    startCommand: python manage.py poll_change_feeds
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.2"
      # Optional notification (leave unset to skip the ping):
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false

  # Friday digest — renders the week's register into the triage email (read-only; Phase 2).
  # RESEND_API_KEY comes from Ken's Resend account (delviotax.com is the verified domain);
  # DIGEST_EMAIL_TO defaults to ken@delviotax.com in code, override here if needed.
  - type: cron
    name: sherpa-rs-change-digest
    runtime: python
    region: virginia
    plan: starter
    schedule: "0 13 * * 5"  # Fridays 13:00 UTC (9am ET) — matches the policy doc's triage slot
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py change_digest --since-days 7 --email
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: RESEND_API_KEY
        sync: false
      - key: DIGEST_EMAIL_TO
        sync: false
      - key: DIGEST_EMAIL_FROM
        sync: false
      - key: RS_BASE_URL
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: PUSHOVER_USER
        sync: false
